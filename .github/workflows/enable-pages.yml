name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.createPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow'
              });
              core.info('Pages site created');
            } catch (error) {
              if (error.status === 409) {
                core.info('Pages site already exists');
              } else {
                core.info('Create failed: ' + error.message);
                try {
                  const site = await github.rest.repos.getPages({
                    owner: context.repo.owner,
                    repo: context.repo.repo
                  });
                  core.info('Pages site exists: ' + JSON.stringify(site.data));
                } catch (e) {
                  core.info('Get failed: ' + e.message);
                  throw error;
                }
              }
            }
